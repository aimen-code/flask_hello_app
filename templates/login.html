{% extends "base.html" %}
{% block title %} Login {% endblock %}
{% block content %}
    <h1> Login </h1>
    <form action = "{{url_for('login')}}" method = "POST">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>
        <input type="submit" value="Login">
        {% if message %}
            <p style="color:red">{{message}}</p>
        {% endif %}    
    </form>
{% endblock %}
